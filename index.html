<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4학년 5반 실시간 소통 공간</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }
        .title-font {
            font-family: 'Jua', sans-serif;
        }
        .polaroid {
            background: #ffffff;
            padding: 1rem 1rem 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: rotate(-1deg);
            transition: transform 0.2s;
        }
        .polaroid:nth-child(even) {
            transform: rotate(1deg);
        }
        .polaroid:hover {
            transform: scale(1.02) rotate(0deg);
        }
        .washi-tape {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 22px;
            background: rgba(253, 224, 71, 0.8);
            border: 1px dashed #ca8a04;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-12">

    <!-- Passcode Lock Screen -->
    <div id="lockScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/90 backdrop-blur-sm p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border-4 border-indigo-500">
            <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl animate-bounce">
                🏫
            </div>
            <h1 class="title-font text-3xl text-indigo-900 mb-2">4학년 5반 소통 공간</h1>
            <p class="text-gray-600 mb-6 font-bold">반 친구들만 입장할 수 있어요!<br>입장 번호(비밀번호 4자리)를 입력해주세요.</p>
            
            <form onsubmit="handleUnlock(event)" class="space-y-4">
                <div>
                    <input type="password" id="passcodeInput" placeholder="입장 번호 4자리" maxlength="6" 
                        class="w-full px-4 py-3 text-center text-2xl tracking-widest border-2 border-indigo-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-indigo-50/50" required>
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold text-xl rounded-2xl transition-all shadow-lg cursor-pointer">
                    🚀 입장하기
                </button>
            </form>
            <p id="lockError" class="text-rose-500 text-sm mt-3 font-bold hidden">비밀번호는 4자리 이상 입력해 주세요!</p>
        </div>
    </div>

    <!-- Main Application -->
    <div id="appContainer" class="hidden max-w-5xl mx-auto px-4 py-6">
        
        <!-- Header Banner -->
        <header class="bg-gradient-to-r from-indigo-600 to-blue-600 p-6 sm:p-8 rounded-3xl shadow-xl text-white mb-6">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left">
                <div class="flex items-center gap-3">
                    <span class="text-5xl">🎒</span>
                    <div>
                        <h1 class="title-font text-4xl sm:text-5xl text-yellow-300 drop-shadow-md">4학년 5반 소통방</h1>
                        <p class="text-base sm:text-lg text-indigo-100 font-bold">친구들과 자유롭게 글과 사진을 나누는 공간이에요!</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button type="button" onclick="openNewPostModal()" class="px-6 py-3.5 bg-yellow-400 hover:bg-yellow-300 active:scale-95 text-slate-900 font-bold text-xl rounded-2xl transition-all flex items-center gap-2 shadow-lg cursor-pointer">
                        <span>✏️</span> 새 글 쓰기
                    </button>
                    <button type="button" onclick="lockApp()" class="px-3.5 py-3.5 bg-indigo-800/80 hover:bg-indigo-700 text-white rounded-2xl font-bold text-sm cursor-pointer" title="잠금">
                        🔒
                    </button>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex gap-3 mb-6 bg-white p-3 rounded-2xl shadow-md border border-slate-100">
            <button type="button" id="tabFreeBoardBtn" onclick="switchTab('free')" class="flex-1 px-4 py-3 rounded-xl font-bold text-lg transition-all flex items-center justify-center gap-2 bg-indigo-600 text-white shadow cursor-pointer">
                💬 반 친구 수다방 (<span id="freePostCount">0</span>)
            </button>
            <button type="button" id="tabPhotoGalleryBtn" onclick="switchTab('photo')" class="flex-1 px-4 py-3 rounded-xl font-bold text-lg transition-all flex items-center justify-center gap-2 text-slate-600 hover:bg-slate-100 cursor-pointer">
                📸 추억 사진방 (<span id="photoPostCount">0</span>)
            </button>
        </div>

        <!-- TAB 1: Free Board -->
        <section id="sectionFreeBoard" class="space-y-6">
            <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-3 items-center justify-between">
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <span class="text-xl">🔍</span>
                    <input type="text" id="freeSearchInput" oninput="filterFreePosts()" placeholder="내용 또는 이름 검색..." class="w-full sm:w-64 px-4 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50">
                </div>
                <div class="text-sm font-bold text-indigo-700 text-center sm:text-right">
                    ✨ 친구들에게 상처 주는 말은 절대 안돼요! 바른 말을 사용합시다 😊
                </div>
            </div>

            <div id="freePostsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
        </section>

        <!-- TAB 2: Photo Gallery -->
        <section id="sectionPhotoGallery" class="space-y-6 hidden">
            <div class="bg-indigo-50 p-5 rounded-2xl border-2 border-indigo-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div>
                    <h2 class="title-font text-2xl text-indigo-900">📸 4학년 5반 추억 사진방</h2>
                    <p class="text-sm text-indigo-700 font-bold">학교생활, 현장체험학습 등 멋진 순간을 사진으로 공유해봐요!</p>
                </div>
                <button type="button" onclick="openNewPostModal()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow cursor-pointer">사진 올리기</button>
            </div>

            <div id="photoGridContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        </section>

    </div>

    <!-- New Post Modal -->
    <div id="postModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 hidden">
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl max-w-lg w-full max-h-[90vh] flex flex-col border-4 border-indigo-500">
            <div class="flex items-center justify-between pb-3 border-b border-slate-200">
                <h3 id="modalTitle" class="title-font text-2xl text-indigo-900 flex items-center gap-2"><span>✏️</span> 새 글 작성하기</h3>
                <button type="button" onclick="closeNewPostModal()" class="text-gray-400 hover:text-gray-600 text-3xl font-bold leading-none cursor-pointer">&times;</button>
            </div>

            <form id="postForm" onsubmit="handlePostSubmit(event)" class="overflow-y-auto flex-1 py-4 space-y-4 pr-1">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">게시판 선택</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center justify-center gap-1 p-2.5 bg-indigo-50 rounded-xl border-2 border-indigo-200 cursor-pointer text-sm font-bold text-indigo-900">
                            <input type="radio" name="postType" value="free" checked onchange="toggleFormMode(this.value)"> 수다방 글쓰기
                        </label>
                        <label class="flex items-center justify-center gap-1 p-2.5 bg-amber-50 rounded-xl border-2 border-amber-200 cursor-pointer text-sm font-bold text-amber-900">
                            <input type="radio" name="postType" value="photo" onchange="toggleFormMode(this.value)"> 사진방 사진 올리기
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">작성자 이름</label>
                        <input type="text" id="postAuthor" placeholder="예: 김철수" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-slate-50" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">이모지 선택</label>
                        <select id="postSticker" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-slate-50 font-bold">
                            <option value="😊">😊 웃음</option>
                            <option value="🎒">🎒 학교</option>
                            <option value="⚽">⚽ 축구</option>
                            <option value="⭐">⭐ 별</option>
                            <option value="🎨">🎨 미술</option>
                            <option value="🍕">🍕 피자</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">제목</label>
                    <input type="text" id="postTitle" placeholder="제목을 입력하세요..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-slate-50" required>
                </div>

                <div id="photoUploadGroup" class="hidden space-y-2">
                    <label class="block text-sm font-bold text-amber-900">📷 사진 첨부 (휴대폰/PC 사진 선택)</label>
                    <input type="file" id="postImageFile" accept="image/*" onchange="handleImageFileSelect(event)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200 cursor-pointer">
                    <div id="imagePreviewContainer" class="hidden mt-2">
                        <img id="imagePreview" src="" alt="미리보기" class="w-full h-44 object-cover rounded-xl border-2 border-amber-300">
                    </div>
                </div>

                <div>
                    <label id="contentLabel" class="block text-sm font-bold text-slate-700 mb-1">내용</label>
                    <textarea id="postContent" rows="4" placeholder="내용을 자유롭게 적어보세요..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-slate-50" required></textarea>
                </div>
            </form>

            <div class="pt-3 border-t border-slate-200">
                <button type="button" onclick="document.getElementById('postForm').requestSubmit()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold text-xl rounded-2xl transition-all shadow-lg cursor-pointer">
                    ✨ 등록하기
                </button>
            </div>
        </div>
    </div>

    <!-- Photo Lightbox Modal -->
    <div id="photoModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 hidden">
        <div class="bg-white p-6 rounded-3xl max-w-2xl w-full relative shadow-2xl">
            <button type="button" onclick="closePhotoModal()" class="absolute top-3 right-4 text-gray-500 hover:text-black text-3xl font-bold cursor-pointer">&times;</button>
            <div class="overflow-hidden rounded-2xl bg-black mb-4 max-h-[60vh] flex items-center justify-center">
                <img id="lightboxImg" src="" alt="확대 사진" class="max-h-[60vh] object-contain">
            </div>
            <h3 id="lightboxTitle" class="title-font text-2xl text-slate-900 mb-1"></h3>
            <p id="lightboxCaption" class="text-slate-700 text-sm mb-3"></p>
            <div class="flex items-center justify-between text-xs text-slate-500 border-t pt-2 font-bold">
                <span id="lightboxAuthor"></span>
                <span id="lightboxDate"></span>
            </div>
        </div>
    </div>

    <!-- Warning Modal -->
    <div id="warningModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 hidden">
        <div class="bg-white p-6 rounded-3xl max-w-sm w-full text-center space-y-4 shadow-xl">
            <div id="warningIcon" class="text-5xl">⚠️</div>
            <h3 id="warningTitle" class="title-font text-2xl text-indigo-900">알림</h3>
            <p id="warningText" class="text-slate-700 text-sm font-bold leading-relaxed"></p>
            <button type="button" onclick="closeWarningModal()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base rounded-2xl cursor-pointer">확인</button>
        </div>
    </div>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            doc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            query, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 사용자 고유 Firebase 프로젝트 설정 (class4-5)
        const firebaseConfig = {
            apiKey: "AIzaSyAVh9Dr8Zs6mHY_y3Jk00n-dgUC8HaUFqM",
            authDomain: "class4-5.firebaseapp.com",
            projectId: "class4-5",
            storageBucket: "class4-5.firebasestorage.app",
            messagingSenderId: "514544004464",
            appId: "1:514544004464:web:06bd24648055caab04f3b5",
            measurementId: "G-YQE8YK6RNF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const postsColRef = collection(db, "school_posts");

        const BAD_WORDS = ['욕설', '바보', '시발', '개새', '지랄', '병신', '꺼져', '닥쳐', '쓰레기', '죽어'];

        let posts = [];
        let activeTab = 'free';
        let currentPhotoData = '';

        window.showWarningModal = function(title, text, icon = '⚠️') {
            document.getElementById('warningTitle').innerText = title;
            document.getElementById('warningText').innerHTML = text;
            document.getElementById('warningIcon').innerText = icon;
            document.getElementById('warningModal').classList.remove('hidden');
        }

        window.closeWarningModal = function() {
            document.getElementById('warningModal').classList.add('hidden');
        }

        function containsBadWords(str) {
            if (!str) return false;
            return BAD_WORDS.some(word => str.toLowerCase().includes(word));
        }

        window.handleUnlock = function(e) {
            e.preventDefault();
            const val = document.getElementById('passcodeInput').value.trim();
            if (val.length >= 4) {
                sessionStorage.setItem('isUnlocked', 'true');
                document.getElementById('lockScreen').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
            } else {
                document.getElementById('lockError').classList.remove('hidden');
            }
        }

        window.lockApp = function() {
            sessionStorage.removeItem('isUnlocked');
            document.getElementById('lockScreen').classList.remove('hidden');
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('passcodeInput').value = '';
        }

        function initFirestoreListener() {
            const q = query(postsColRef, orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const cloudPosts = [];
                snapshot.forEach(docSnap => {
                    cloudPosts.push({ id: docSnap.id, ...docSnap.data() });
                });
                posts = cloudPosts;
                renderAll();
            }, (error) => {
                console.error("실시간 동기화 에러:", error);
            });
        }

        window.switchTab = function(tabName) {
            activeTab = tabName;
            
            const freeBtn = document.getElementById('tabFreeBoardBtn');
            const photoBtn = document.getElementById('tabPhotoGalleryBtn');
            const freeSec = document.getElementById('sectionFreeBoard');
            const photoSec = document.getElementById('sectionPhotoGallery');

            [freeBtn, photoBtn].forEach(btn => {
                btn.className = "flex-1 px-4 py-3 rounded-xl font-bold text-lg transition-all flex items-center justify-center gap-2 text-slate-600 hover:bg-slate-100 cursor-pointer";
            });

            [freeSec, photoSec].forEach(sec => sec.classList.add('hidden'));

            if (tabName === 'free') {
                freeBtn.className = "flex-1 px-4 py-3 rounded-xl font-bold text-lg transition-all flex items-center justify-center gap-2 bg-indigo-600 text-white shadow cursor-pointer";
                freeSec.classList.remove('hidden');
            } else if (tabName === 'photo') {
                photoBtn.className = "flex-1 px-4 py-3 rounded-xl font-bold text-lg transition-all flex items-center justify-center gap-2 bg-indigo-600 text-white shadow cursor-pointer";
                photoSec.classList.remove('hidden');
            }
        }

        function renderAll() {
            renderFreePosts();
            renderPhotoGallery();
        }

        function renderFreePosts(filteredPosts = null) {
            const container = document.getElementById('freePostsContainer');
            const freePostsList = posts.filter(p => p.type === 'free');
            const postsToRender = filteredPosts || freePostsList;
            
            document.getElementById('freePostCount').innerText = freePostsList.length;
            document.getElementById('photoPostCount').innerText = posts.filter(p => p.type === 'photo').length;

            if (postsToRender.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-white p-8 rounded-2xl text-center text-slate-500 shadow-sm border border-slate-200">
                        <span class="text-4xl block mb-2">💬</span>
                        아직 작성된 글이 없어요. 첫 번째 이야기를 남겨보세요!
                    </div>
                `;
                return;
            }

            container.innerHTML = postsToRender.map(post => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between gap-2 border-b border-slate-100 pb-3 mb-3">
                            <div class="flex items-center gap-2">
                                <span class="text-2xl">${post.sticker || '😊'}</span>
                                <div>
                                    <h3 class="title-font text-xl text-slate-900">${escapeHtml(post.title)}</h3>
                                    <p class="text-xs text-slate-500 font-bold">✍️ ${escapeHtml(post.author)} | 📅 ${post.date}</p>
                                </div>
                            </div>
                            <button type="button" onclick="deletePost('${post.id}')" class="text-slate-400 hover:text-rose-500 text-base cursor-pointer" title="삭제">🗑️</button>
                        </div>
                        <p class="text-slate-700 text-base leading-relaxed whitespace-pre-line mb-4">${escapeHtml(post.content)}</p>
                    </div>

                    <div class="pt-3 border-t border-slate-100">
                        <div class="flex items-center justify-between mb-2">
                            <button type="button" onclick="toggleLike('${post.id}')" class="flex items-center gap-1 px-3 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold rounded-xl cursor-pointer">
                                <span>❤️</span> 좋아요 <span>${post.likes || 0}</span>
                            </button>
                            <span class="text-xs text-slate-400 font-bold">💬 댓글 ${(post.comments || []).length}개</span>
                        </div>

                        <div class="space-y-1.5 bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs">
                            ${(post.comments || []).map(c => `
                                <div class="bg-white p-1.5 rounded border border-slate-100">
                                    <strong class="text-indigo-800">${escapeHtml(c.author)}:</strong>
                                    <span class="text-slate-700">${escapeHtml(c.text)}</span>
                                </div>
                            `).join('')}

                            <div class="flex gap-1 pt-1">
                                <input type="text" id="commentAuthor-${post.id}" placeholder="이름" class="w-16 px-2 py-1 rounded border border-slate-300 bg-white">
                                <input type="text" id="commentText-${post.id}" placeholder="댓글 남기기..." class="flex-1 px-2 py-1 rounded border border-slate-300 bg-white">
                                <button type="button" onclick="addComment('${post.id}')" class="px-2.5 py-1 bg-indigo-600 text-white font-bold rounded cursor-pointer">등록</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderPhotoGallery() {
            const container = document.getElementById('photoGridContainer');
            const photoPosts = posts.filter(p => p.type === 'photo');

            document.getElementById('freePostCount').innerText = posts.filter(p => p.type === 'free').length;
            document.getElementById('photoPostCount').innerText = photoPosts.length;

            if (photoPosts.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-white p-8 rounded-2xl text-center text-slate-500 shadow-sm border border-slate-200">
                        <span class="text-4xl block mb-2">📸</span>
                        아직 공유된 사진이 없어요! 추억 사진을 올려보세요.
                    </div>
                `;
                return;
            }

            container.innerHTML = photoPosts.map(post => `
                <div class="polaroid relative flex flex-col justify-between">
                    <div class="washi-tape"></div>
                    <div class="cursor-pointer" onclick="openPhotoModal('${escapeHtml(post.photoUrl)}', '${escapeHtml(post.title)}', '${escapeHtml(post.content)}', '${escapeHtml(post.author)}', '${post.date}')">
                        <div class="overflow-hidden rounded-lg bg-slate-100 aspect-video mb-3">
                            <img src="${escapeHtml(post.photoUrl)}" alt="${escapeHtml(post.title)}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                        </div>
                        <h4 class="title-font text-lg text-slate-900 truncate">${escapeHtml(post.title)}</h4>
                        <p class="text-xs text-slate-600 line-clamp-2 mb-2">${escapeHtml(post.content)}</p>
                    </div>

                    <div class="pt-2 border-t border-slate-100">
                        <div class="flex items-center justify-between text-xs text-slate-500 mb-2">
                            <span class="font-bold text-indigo-700">✍️ ${escapeHtml(post.author)}</span>
                            <button type="button" onclick="deletePost('${post.id}')" class="text-slate-400 hover:text-rose-500 cursor-pointer">🗑️</button>
                        </div>
                        <div class="flex items-center justify-between">
                            <button type="button" onclick="toggleLike('${post.id}')" class="flex items-center gap-1 text-xs px-2 py-0.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-lg cursor-pointer">
                                <span>❤️</span> ${post.likes || 0}
                            </button>
                            <span class="text-xs text-slate-400">${post.date}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.toggleLike = async function(id) {
            const post = posts.find(p => p.id === id);
            if (post) {
                try {
                    const docRef = doc(db, "school_posts", id);
                    await updateDoc(docRef, { likes: (post.likes || 0) + 1 });
                } catch (e) {
                    console.error("좋아요 에러:", e);
                }
            }
        }

        window.addComment = async function(postId) {
            const authorInput = document.getElementById(`commentAuthor-${postId}`);
            const textInput = document.getElementById(`commentText-${postId}`);
            if (!authorInput || !textInput) return;

            const author = authorInput.value.trim();
            const text = textInput.value.trim();

            if (!author || !text) {
                showWarningModal('입력 오류', '이름과 댓글 내용을 모두 입력해주세요!');
                return;
            }

            if (containsBadWords(author) || containsBadWords(text)) {
                showWarningModal('사용 제한', '바른 말을 사용해 주세요! 부적절한 단어가 포함되어 있습니다.');
                return;
            }

            const post = posts.find(p => p.id === postId);
            if (post) {
                const newComments = [...(post.comments || []), { author, text }];
                try {
                    const docRef = doc(db, "school_posts", postId);
                    await updateDoc(docRef, { comments: newComments });
                    authorInput.value = '';
                    textInput.value = '';
                } catch (e) {
                    console.error("댓글 에러:", e);
                }
            }
        }

        window.deletePost = async function(id) {
            if (!confirm("정말 이 글을 삭제하시겠습니까?")) return;
            try {
                const docRef = doc(db, "school_posts", id);
                await deleteDoc(docRef);
            } catch (e) {
                console.error("삭제 에러:", e);
            }
        }

        window.openNewPostModal = function() {
            document.getElementById('postModal').classList.remove('hidden');
            const mode = activeTab === 'photo' ? 'photo' : 'free';
            toggleFormMode(mode);
            document.querySelectorAll('input[name="postType"]').forEach(r => {
                r.checked = (r.value === mode);
            });
        }

        window.closeNewPostModal = function() {
            document.getElementById('postModal').classList.add('hidden');
            document.getElementById('postForm').reset();
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            currentPhotoData = '';
        }

        window.toggleFormMode = function(mode) {
            const photoGroup = document.getElementById('photoUploadGroup');
            const modalTitle = document.getElementById('modalTitle');
            if (mode === 'photo') {
                photoGroup.classList.remove('hidden');
                modalTitle.innerHTML = '<span>📸</span> 추억 사진 올리기';
            } else {
                photoGroup.classList.add('hidden');
                modalTitle.innerHTML = '<span>✏️</span> 수다방 글쓰기';
            }
        }

        // 사진 자동 압축 엔진
        window.handleImageFileSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 900;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    currentPhotoData = canvas.toDataURL('image/jpeg', 0.7);
                    const previewImg = document.getElementById('imagePreview');
                    previewImg.src = currentPhotoData;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.handlePostSubmit = async function(e) {
            e.preventDefault();
            const postTypeInput = document.querySelector('input[name="postType"]:checked');
            const postType = postTypeInput ? postTypeInput.value : activeTab;
            const author = document.getElementById('postAuthor').value.trim();
            const title = document.getElementById('postTitle').value.trim();
            const sticker = document.getElementById('postSticker').value;
            const content = document.getElementById('postContent').value.trim();

            if (!author || !title || !content) {
                showWarningModal('입력 확인', '작성자, 제목, 내용을 모두 입력해주세요!');
                return;
            }

            if (containsBadWords(author) || containsBadWords(title) || containsBadWords(content)) {
                showWarningModal('사용 제한', '바른 말을 사용해 주세요! 부적절한 단어가 포함되어 있습니다.');
                return;
            }

            let finalPhotoUrl = currentPhotoData;
            if (postType === 'photo' && !finalPhotoUrl) {
                showWarningModal('사진 필요', '사진방에 올릴 사진을 선택해주세요!');
                return;
            }

            const now = new Date();
            const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;

            const newPost = {
                type: postType,
                title,
                author,
                sticker,
                content,
                photoUrl: postType === 'photo' ? finalPhotoUrl : '',
                date: dateStr,
                createdAt: Date.now(),
                likes: 0,
                comments: []
            };

            try {
                await addDoc(postsColRef, newPost);
                closeNewPostModal();
                switchTab(postType);
            } catch (e) {
                console.error("저장 에러:", e);
                showWarningModal('저장 오류', '데이터 저장 중 오류가 발생했습니다. (Firestore 보안 규칙을 확인해주세요)');
            }
        }

        window.openPhotoModal = function(url, title, caption, author, date) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightboxTitle').innerText = title;
            document.getElementById('lightboxCaption').innerText = caption;
            document.getElementById('lightboxAuthor').innerText = `✍️ ${author}`;
            document.getElementById('lightboxDate').innerText = `📅 ${date}`;
            document.getElementById('photoModal').classList.remove('hidden');
        }

        window.closePhotoModal = function() {
            document.getElementById('photoModal').classList.add('hidden');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('isUnlocked') === 'true') {
                document.getElementById('lockScreen').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
            } else {
                document.getElementById('lockScreen').classList.remove('hidden');
            }
            initFirestoreListener();
        });
    </script>
</body>
</html>
